<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track order — Sweet Crust</title><link rel="stylesheet" href="/css/styles.css"></head><body><div id="toast" class="toast hidden"></div><header class="navbar"><div class="container nav-inner"><a class="brand" href="/"><span class="brand-mark">SC</span>Sweet Crust</a><a class="cart-link" href="/menu.html">Menu</a></div></header><main class="container"><section class="page-title"><span class="eyebrow">Your treats are on their way</span><h1>Track your order</h1><p class="muted">Enter the order number and phone number used at checkout.</p></section><section class="panel" style="max-width:650px;margin-bottom:70px"><form id="track-form" class="form-grid"><div class="field full"><label>Order number</label><input name="order_number" id="track-number" required placeholder="SC-ABC12345"></div><div class="field full"><label>Phone number</label><input name="phone" required maxlength="24" placeholder="Phone used for order"></div><div class="field full"><button class="btn">Track order</button></div></form><div id="track-result" style="margin-top:20px"></div></section></main><script>const n=new URLSearchParams(location.search).get("order");if(n)document.querySelector("#track-number").value=n</script><script src="/js/app.js"></script></body></html>
