<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Sweet Crust</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="navbar"><div class="container nav-inner"><a class="brand" href="/"><span class="brand-mark">SC</span>Sweet Crust <span class="muted">Admin</span></a><button id="admin-logout" class="btn secondary small">Log out</button></div></header><main class="container" style="padding:30px 0 70px"><section id="login-wrap" class="panel" style="max-width:450px;margin:50px auto"><h1>Admin sign in</h1><p class="muted">Sign in to manage orders and the bakery.</p><form id="admin-login" class="form-grid"><div class="field full"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field full"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><div class="field full"><button class="btn">Sign in</button><p id="login-error" style="color:#b42318"></p></div></form></section><section id="admin-app" class="hidden"><h1>Business dashboard</h1><p class="muted">Orders, menu, customers and settings.</p><nav class="admin-nav"><button data-view="dashboard">Dashboard</button><button data-view="orders">Orders</button><button data-view="products">Menu items</button><button data-view="cakes">Cake requests</button><button data-view="reservations">Reservations</button><button data-view="customers">Customers</button><button data-view="feedback">Feedback</button><button data-view="ai">AI chats</button><button data-view="settings">Settings</button></nav><section id="admin-content" class="panel"><p>Loading…</p></section></section></main><script src="/js/admin.js"></script><script>const old=document.querySelector("#admin-login");old?.addEventListener("submit",()=>document.querySelector("#login-wrap").classList.add("hidden"));</script></body></html>
