<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Sweet Crust</title><link rel="stylesheet" href="/css/styles.css"></head><body><div id="toast" class="toast hidden"></div><header class="navbar"><div class="container nav-inner"><a class="brand" href="/"><span class="brand-mark">SC</span>Sweet Crust</a><nav class="nav-links"><a href="/menu.html">Menu</a><a href="/cart.html">Cart</a></nav><span>Secure checkout · COD</span></div></header><main class="container"><section class="page-title"><span class="eyebrow">One last step</span><h1>Checkout</h1><p class="muted">Cash on delivery is available. Online payments are coming soon.</p></section><div class="layout-two" style="padding-bottom:70px"><form id="checkout-form" class="panel form-grid"><div class="field full"><label>Full name *</label><input name="name" required minlength="2" maxlength="100" autocomplete="name"></div><div class="field"><label>Phone number *</label><input name="phone" required pattern="[+()0-9 -]{7,24}" maxlength="24" placeholder="+92 300 1234567" autocomplete="tel"></div><div class="field"><label>Delivery or pickup *</label><select name="fulfillment" id="fulfillment"><option value="delivery">Home delivery</option><option value="pickup">Pickup from shop</option></select></div><div class="field full"><label>Delivery address</label><textarea name="address" rows="2" maxlength="500" placeholder="House, street, area, city"></textarea></div><div class="field"><label>Preferred time</label><input name="preferred_time" placeholder="e.g. Today 6–7 PM" maxlength="100"></div><div class="field"><label>Coupon code (optional)</label><input name="coupon_code" maxlength="30" placeholder="SWEET10"></div><div class="field full"><label>Order notes</label><textarea name="order_notes" rows="2" maxlength="1000" placeholder="Any delivery instructions?"></textarea></div><div class="field full"><label>Payment method</label><select disabled><option>Cash on Delivery / Pay at pickup</option><option>JazzCash (coming soon)</option><option>Easypaisa (coming soon)</option></select></div><div class="field full"><button class="btn" type="submit">Place order →</button><p class="muted" style="font-size:.8rem">By placing your order, you confirm the details are correct.</p></div></form><aside class="panel"><h2>Your order</h2><div id="cart-items"></div><div class="total-row"><span>Subtotal</span><strong id="subtotal">PKR 0</strong></div><div class="total-row"><span>Delivery fee (estimate)</span><strong id="delivery-fee">PKR 200</strong></div><div class="total-row final"><span>Estimated total</span><strong id="grand-total">PKR 0</strong></div></aside></div></main><script src="/js/app.js"></script></body></html>
